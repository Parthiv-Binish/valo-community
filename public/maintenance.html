<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101014" />
  <meta name="robots" content="noindex, nofollow" />
  <title>VALO Community — Maintenance</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#101014;color:#f4f4f5;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,680px);text-align:center;padding:64px 28px;border:1px solid #29292f;border-radius:24px;background:linear-gradient(145deg,#19191f,#121216);box-shadow:0 24px 90px #0008}
    .mark{width:54px;height:54px;margin:0 auto 30px;border:1px solid #ef444466;border-radius:16px;display:grid;place-items:center;color:#ef4444;font-size:23px;font-weight:800;letter-spacing:-2px}
    .eyebrow{color:#ef4444;font-size:11px;font-weight:750;letter-spacing:3px;text-transform:uppercase}
    h1{font-size:clamp(32px,7vw,52px);line-height:1.05;letter-spacing:-2px;margin:18px 0}
    p{max-width:480px;margin:0 auto;color:#a1a1aa;font-size:15px;line-height:1.8}
    .line{width:46px;height:3px;background:#ef4444;margin:32px auto;border-radius:4px}
    footer{margin-top:42px;color:#666670;font-size:12px;letter-spacing:.5px}
  </style>
</head>
<body>
  <main>
    <div class="mark">V</div>
    <div class="eyebrow">VALO Community</div>
    <h1>We’ll be right back.</h1>
    <p>We’re performing scheduled maintenance and improvements to the community experience. The website is temporarily unavailable while we work behind the scenes.</p>
    <div class="line"></div>
    <p>Thank you for your patience. Please check back soon.</p>
    <footer>LET’S BUILD VALO COMMUNITY</footer>
  </main>
</body>
</html>
